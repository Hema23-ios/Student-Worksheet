<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Christel House India | Student Worksheet Portal</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: "Segoe UI", Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 25px 20px;

    /* Modern technology-inspired background */
    background:
        linear-gradient(rgba(24, 52, 74, 0.88), rgba(24, 52, 74, 0.88)),
        url("https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&w=1600&q=80");
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
}

/* Main panel */
.container {
    width: 100%;
    max-width: 1100px;
    background: rgba(255, 255, 255, 0.96);
    border-radius: 28px;
    padding: 38px 48px 27px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 18px 50px rgba(0,0,0,0.28);
}

/* School-colour accent */
.top-line {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 7px;
    background: linear-gradient(
        to right,
        #F7941D 50%,
        #43A9DB 50%
    );
}

/* Header */
.header {
    text-align: center;
    margin-bottom: 30px;
}

.school-brand {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 13px;
    margin-bottom: 13px;
}

.school-logo {
    width: 62px;
    height: 62px;
    object-fit: contain;
    flex-shrink: 0;
}

.school-name {
    text-align: left;
}

.school-name h1 {
    font-size: 36px;
    color: #F39200;
    font-weight: 750;
    letter-spacing: -0.8px;
}

.school-name p {
    font-size: 10px;
    color: #329ACF;
    font-weight: 700;
    letter-spacing: 4px;
    margin-top: 3px;
}

.portal-title {
    color: #263B4C;
    font-size: 23px;
    font-weight: 700;
    margin-bottom: 9px;
}

.instruction {
    color: #64717C;
    font-size: 16px;
}

/* Grade cards */
.grade-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 18px;
}

.grade-card {
    min-height: 125px;
    border-radius: 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    text-decoration: none;
    color: #293746;
    transition: all 0.3s ease;
    border: 1px solid rgba(0,0,0,0.06);
    position: relative;
    overflow: hidden;
}

/* Different background colours */
.grade-card:nth-child(1) {
    background: #FFF4E5;
}

.grade-card:nth-child(2) {
    background: #EAF6FF;
}

.grade-card:nth-child(3) {
    background: #F1F8E9;
}

.grade-card:nth-child(4) {
    background: #F3EEFF;
}

.grade-card:nth-child(5) {
    background: #FFF0F4;
}

/* Folder icon */
.folder-box {
    width: 58px;
    height: 42px;
    border-radius: 5px 8px 8px 8px;
    position: relative;
    box-shadow: 0 5px 10px rgba(0,0,0,0.12);
}

/* Folder tab */
.folder-box::before {
    content: "";
    position: absolute;
    width: 25px;
    height: 10px;
    top: -7px;
    left: 3px;
    border-radius: 5px 5px 0 0;
}

/* Individual folder colours */
.grade-card:nth-child(1) .folder-box,
.grade-card:nth-child(1) .folder-box::before {
    background: #F7941D;
}

.grade-card:nth-child(2) .folder-box,
.grade-card:nth-child(2) .folder-box::before {
    background: #43A9DB;
}

.grade-card:nth-child(3) .folder-box,
.grade-card:nth-child(3) .folder-box::before {
    background: #75A843;
}

.grade-card:nth-child(4) .folder-box,
.grade-card:nth-child(4) .folder-box::before {
    background: #8A6FD1;
}

.grade-card:nth-child(5) .folder-box,
.grade-card:nth-child(5) .folder-box::before {
    background: #E86A92;
}

/* Small document symbol inside folder */
.folder-box::after {
    content: "▤";
    position: absolute;
    color: white;
    font-size: 22px;
    font-weight: bold;
    left: 18px;
    top: 8px;
}

.grade-name {
    font-size: 20px;
    font-weight: 700;
}

/* Hover effect */
.grade-card:hover {
    transform: translateY(-7px) scale(1.02);
    box-shadow: 0 12px 25px rgba(0,0,0,0.13);
    border-color: rgba(0,0,0,0.10);
}

.grade-card:hover .folder-box {
    transform: scale(1.08);
}

.folder-box {
    transition: transform 0.3s ease;
}

/* Footer */
.footer {
    border-top: 1px solid #E6E9EB;
    margin-top: 28px;
    padding-top: 17px;
    text-align: center;
    color: #87919A;
    font-size: 12px;
}

.footer strong {
    color: #E89112;
}

/* Tablet */
@media (max-width: 750px) {
    .container {
        padding: 38px 25px 25px;
    }

    .grade-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 14px;
    }

    .school-name h1 {
        font-size: 29px;
    }
}

/* Mobile */
@media (max-width: 480px) {
    body {
        padding: 12px;
        background-attachment: scroll;
    }

    .container {
        padding: 35px 17px 23px;
    }

    .school-logo {
        width: 48px;
        height: 48px;
    }

    .school-name h1 {
        font-size: 22px;
    }

    .portal-title {
        font-size: 19px;
    }

    .instruction {
        font-size: 14px;
        line-height: 1.5;
    }

    .grade-grid {
        grid-template-columns: 1fr;
    }

    .grade-card {
        min-height: 110px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="top-line"></div>

    <!-- CHRISTEL HOUSE INDIA HEADER -->
    <header class="header">

        <div class="school-brand">
            <img
                src="christel-house-logo.png"
                alt="Christel House India Logo"
                class="school-logo"
            >

            <div class="school-name">
                <h1>Christel House India</h1>
                <p>BANGALORE</p>
            </div>
        </div>

        <h2 class="portal-title">Student Worksheet Portal</h2>

        <p class="instruction">
            Choose your grade below to access learning resources.
        </p>

    </header>

    <!-- GRADE-WISE WORKSHEET FOLDERS -->
    <main class="grade-grid">

        <a href="https://hema23-ios.github.io/Student-Worksheet/Grade%203/" class="grade-card">
            <div class="folder-box"></div>
            <span class="grade-name">Grade 3</span>
        </a>

        <a href="https://hema23-ios.github.io/Student-Worksheet/Grade%205/" class="grade-card">
            <div class="folder-box"></div>
            <span class="grade-name">Grade 5</span>
        </a>

        <a href="https://hema23-ios.github.io/Student-Worksheet/Grade%206/" class="grade-card">
            <div class="folder-box"></div>
            <span class="grade-name">Grade 6</span>
        </a>

        <a href="https://hema23-ios.github.io/Student-Worksheet/Grade%207/" class="grade-card">
            <div class="folder-box"></div>
            <span class="grade-name">Grade 7</span>
        </a>

        <a href="https://hema23-ios.github.io/Student-Worksheet/Stars%201/" class="grade-card">
            <div class="folder-box"></div>
            <span class="grade-name">Stars 1</span>
        </a>

    </main>

    <!-- FOOTER -->
    <footer class="footer">
        <p>
            <strong>Christel House India</strong>
            &nbsp; | &nbsp;
            Learning • Exploring • Creating
        </p>
    </footer>

</div>

</body>
</html>
