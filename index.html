<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Christel House India | Student Worksheet Portal</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: "Segoe UI", Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 30px 20px;

    /* Computer Lab / Education Background */
    background:
        linear-gradient(
            rgba(17, 70, 110, 0.72),
            rgba(17, 70, 110, 0.72)
        ),
        url("education-background.png");

    background-size: cover;
    background-position: center;
    background-attachment: fixed;
}

/* Main portal panel */
.container {
    width: 100%;
    max-width: 1120px;
    background: rgba(255, 255, 255, 0.97);
    border-radius: 32px;
    padding: 40px 50px 28px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 20px 55px rgba(0, 0, 0, 0.30);
}

/* Colourful top accent */
.top-line {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 9px;
    background: linear-gradient(
        to right,
        #F7941D 0%,
        #F7941D 50%,
        #43A9DB 50%,
        #43A9DB 100%
    );
}

/* Decorative circles */
.container::before,
.container::after {
    content: "";
    position: absolute;
    border-radius: 50%;
    z-index: 0;
}

.container::before {
    width: 180px;
    height: 180px;
    background: rgba(67, 169, 219, 0.06);
    top: -80px;
    right: -60px;
}

.container::after {
    width: 150px;
    height: 150px;
    background: rgba(247, 148, 29, 0.06);
    bottom: -80px;
    left: -50px;
}

/* Keep content above decorations */
.header,
.grade-grid,
.footer {
    position: relative;
    z-index: 1;
}

/* Header */
.header {
    text-align: center;
    margin-bottom: 32px;
}

.school-brand {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin-bottom: 14px;
}

.school-logo {
    width: 65px;
    height: 65px;
    object-fit: contain;
    flex-shrink: 0;
}

.school-name {
    text-align: left;
}

.school-name h1 {
    font-size: 36px;
    color: #F39200;
    font-weight: 750;
    letter-spacing: -0.8px;
}

.school-name p {
    font-size: 10px;
    color: #329ACF;
    font-weight: 700;
    letter-spacing: 4px;
    margin-top: 3px;
}

/* Portal title */
.portal-title {
    display: inline-block;
    background: #164C82;
    color: white;
    padding: 10px 35px;
    border-radius: 30px;
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 13px;
    box-shadow: 0 5px 12px rgba(22, 76, 130, 0.18);
}

.instruction {
    color: #455866;
    font-size: 16px;
    font-weight: 500;
}

/* Grade cards */
.grade-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 20px;
}

/* Individual card */
.grade-card {
    min-height: 155px;
    border-radius: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 13px;
    text-decoration: none;
    color: #253544;
    border: 2px solid transparent;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
}

/* Different education-inspired card backgrounds */
.grade-card:nth-child(1) {
    background: linear-gradient(145deg, #FFF8E7, #FFF0C9);
    border-color: #F5D889;
}

.grade-card:nth-child(2) {
    background: linear-gradient(145deg, #EAF7FF, #D6EEFF);
    border-color: #9ED4F3;
}

.grade-card:nth-child(3) {
    background: linear-gradient(145deg, #F1F9E9, #E0F1D2);
    border-color: #AED08F;
}

.grade-card:nth-child(4) {
    background: linear-gradient(145deg, #F4EFFF, #E9DEFF);
    border-color: #C5ACEB;
}

.grade-card:nth-child(5) {
    background: linear-gradient(145deg, #FFF0F5, #FFE0EB);
    border-color: #F0ABC2;
}

/* Colourful folder */
.folder-icon {
    width: 68px;
    height: 48px;
    border-radius: 7px 9px 9px 9px;
    position: relative;
    box-shadow: 0 6px 10px rgba(0, 0, 0, 0.14);
    transition: transform 0.3s ease;
}

/* Folder tab */
.folder-icon::before {
    content: "";
    position: absolute;
    width: 30px;
    height: 12px;
    left: 4px;
    top: -8px;
    border-radius: 6px 6px 0 0;
}

/* Folder colours */
.grade-card:nth-child(1) .folder-icon,
.grade-card:nth-child(1) .folder-icon::before {
    background: #F5A800;
}

.grade-card:nth-child(2) .folder-icon,
.grade-card:nth-child(2) .folder-icon::before {
    background: #249ED5;
}

.grade-card:nth-child(3) .folder-icon,
.grade-card:nth-child(3) .folder-icon::before {
    background: #76AE3C;
}

.grade-card:nth-child(4) .folder-icon,
.grade-card:nth-child(4) .folder-icon::before {
    background: #8754C7;
}

.grade-card:nth-child(5) .folder-icon,
.grade-card:nth-child(5) .folder-icon::before {
    background: #E95A8A;
}

/* Educational symbol inside each folder */
.folder-icon::after {
    position: absolute;
    color: white;
    font-size: 25px;
    font-weight: bold;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
}

/* Different symbols */
.grade-card:nth-child(1) .folder-icon::after {
    content: "📖";
    font-size: 22px;
}

.grade-card:nth-child(2) .folder-icon::after {
    content: "⌨";
}

.grade-card:nth-child(3) .folder-icon::after {
    content: "⚙";
}

.grade-card:nth-child(4) .folder-icon::after {
    content: "💻";
    font-size: 21px;
}

.grade-card:nth-child(5) .folder-icon::after {
    content: "★";
}

/* Grade name */
.grade-name {
    font-size: 21px;
    font-weight: 700;
}

/* Hover effect */
.grade-card:hover {
    transform: translateY(-8px);
    box-shadow: 0 14px 25px rgba(0, 0, 0, 0.13);
}

.grade-card:hover .folder-icon {
    transform: scale(1.12) rotate(-2deg);
}

/* Footer */
.footer {
    margin-top: 30px;
    padding: 16px;
    background: #164C82;
    border-radius: 14px;
    text-align: center;
    color: #FFFFFF;
    font-size: 13px;
}

.footer strong {
    color: #FFD37A;
}

/* Tablet */
@media (max-width: 750px) {

    .container {
        padding: 38px 25px 25px;
    }

    .grade-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 15px;
    }

    .school-name h1 {
        font-size: 29px;
    }

    .portal-title {
        font-size: 21px;
        padding: 10px 25px;
    }
}

/* Mobile */
@media (max-width: 480px) {

    body {
        padding: 12px;
        background-attachment: scroll;
    }

    .container {
        padding: 35px 17px 22px;
        border-radius: 22px;
    }

    .school-logo {
        width: 50px;
        height: 50px;
    }

    .school-name h1 {
        font-size: 22px;
    }

    .school-name p {
        letter-spacing: 3px;
        font-size: 8px;
    }

    .portal-title {
        font-size: 18px;
        padding: 9px 20px;
    }

    .instruction {
        font-size: 14px;
        line-height: 1.5;
    }

    .grade-grid {
        grid-template-columns: 1fr;
    }

    .grade-card {
        min-height: 125px;
    }

    .footer {
        font-size: 11px;
        line-height: 1.5;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="top-line"></div>

    <!-- HEADER -->
    <header class="header">

        <div class="school-brand">

            <img
                src="christel-house-logo.png"
                alt="Christel House India Logo"
                class="school-logo"
            >

            <div class="school-name">
                <h1>Christel House India</h1>
                <p>BANGALORE</p>
            </div>

        </div>

        <h2 class="portal-title">
            Student Worksheet Portal
        </h2>

        <p class="instruction">
            Choose your grade below to access learning resources.
        </p>

    </header>


    <!-- GRADE-WISE WORKSHEET LINKS -->
    <main class="grade-grid">

        <!-- Grade 3 -->
        <a href="https://hema23-ios.github.io/Student-Worksheet/Grade%203/" class="grade-card">
            <div class="folder-icon"></div>
            <span class="grade-name">Grade 3</span>
        </a>

        <!-- Grade 5 -->
        <a href="https://hema23-ios.github.io/Student-Worksheet/Grade%205/" class="grade-card">
            <div class="folder-icon"></div>
            <span class="grade-name">Grade 5</span>
        </a>

        <!-- Grade 6 -->
        <a href="https://hema23-ios.github.io/Student-Worksheet/Grade%206/" class="grade-card">
            <div class="folder-icon"></div>
            <span class="grade-name">Grade 6</span>
        </a>

        <!-- Grade 7 -->
        <a href="https://hema23-ios.github.io/Student-Worksheet/Grade%207/" class="grade-card">
            <div class="folder-icon"></div>
            <span class="grade-name">Grade 7</span>
        </a>

        <!-- Stars 1 -->
        <a href="https://hema23-ios.github.io/Student-Worksheet/Stars%201/" class="grade-card">
            <div class="folder-icon"></div>
            <span class="grade-name">Stars 1</span>
        </a>

    </main>


    <!-- FOOTER -->
    <footer class="footer">
        <p>
            <strong>Christel House India</strong>
            &nbsp; | &nbsp;
            Learning • Exploring • Creating
        </p>
    </footer>

</div>

</body>
</html>
