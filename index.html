
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Christel House India | Student Worksheet Portal</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: #222222;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 25px 20px;
}

/* Main panel */
.container {
    width: 100%;
    max-width: 1100px;
    background: #ffffff;
    border-radius: 26px;
    padding: 38px 48px 27px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 15px 40px rgba(0,0,0,0.20);
}

/* School-colour accent */
.top-line {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 6px;
    background: linear-gradient(
        to right,
        #F7941D 50%,
        #43A9DB 50%
    );
}

/* Header */
.header {
    text-align: center;
    margin-bottom: 29px;
}

.school-brand {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 13px;
    margin-bottom: 13px;
}

.school-logo {
    width: 62px;
    height: 62px;
    object-fit: contain;
    flex-shrink: 0;
}

.school-name {
    text-align: left;
}

.school-name h1 {
    font-size: 36px;
    color: #F39200;
    font-weight: 750;
    letter-spacing: -0.8px;
}

.school-name p {
    font-size: 10px;
    color: #329ACF;
    font-weight: 700;
    letter-spacing: 4px;
    margin-top: 3px;
}

.portal-title {
    color: #303D4B;
    font-size: 22px;
    font-weight: 650;
    margin-bottom: 9px;
}

.instruction {
    color: #555E68;
    font-size: 16px;
    font-weight: 500;
}

/* Grade cards */
.grade-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 17px;
}

.grade-card {
    min-height: 91px;
    background: #F0F0F0;
    border: 1px solid #DDDDDD;
    border-radius: 15px;
    display: flex;
    align-items: center;
    padding: 15px 23px;
    text-decoration: none;
    color: #293746;
    transition: all 0.25s ease;
}

.folder-icon {
    width: 27px;
    height: 27px;
    color: #333333;
    flex-shrink: 0;
}

.grade-name {
    flex: 1;
    text-align: center;
    padding-right: 27px;
    font-size: 20px;
    font-weight: 650;
}

.grade-card:hover {
    background: #FFF7EA;
    border-color: #F3A52F;
    transform: translateY(-3px);
    box-shadow: 0 7px 18px rgba(0,0,0,0.08);
}

.grade-card:hover .folder-icon {
    color: #E89112;
}

.grade-card:hover .grade-name {
    color: #D98500;
}

/* Footer */
.footer {
    border-top: 1px solid #EEEEEE;
    margin-top: 27px;
    padding-top: 17px;
    text-align: center;
    color: #929292;
    font-size: 12px;
}

.footer strong {
    color: #E89112;
}

/* Tablet */
@media (max-width: 750px) {
    .container {
        padding: 38px 25px 25px;
    }

    .grade-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 13px;
    }

    .school-name h1 {
        font-size: 29px;
    }
}

/* Mobile */
@media (max-width: 480px) {
    body {
        padding: 12px;
    }

    .container {
        padding: 35px 17px 23px;
    }

    .school-logo {
        width: 48px;
        height: 48px;
    }

    .school-name h1 {
        font-size: 22px;
    }

    .portal-title {
        font-size: 19px;
    }

    .instruction {
        font-size: 14px;
        line-height: 1.5;
    }

    .grade-grid {
        grid-template-columns: 1fr;
    }

    .grade-card {
        min-height: 80px;
    }
}
</style>
</head>

<body>
